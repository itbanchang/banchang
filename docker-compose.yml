services:
  bch360:
    build: .
    image: bch360:latest
    container_name: bch360
    restart: unless-stopped
    # network_mode: host allows MariaDB access at 127.0.0.1
    network_mode: host
    volumes:
      - ./data_lake:/app/data_lake
      - ./logs:/app/logs
      - ./.env:/app/.env:ro
    environment:
      NODE_ENV: production
      PORT: 4001
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4001/api/system/health', r => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 5s
      retries: 3
