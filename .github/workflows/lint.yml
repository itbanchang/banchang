name: Lint

on:
  pull_request:
    branches: [master, main, "ux-iteration-*"]
  push:
    branches: [master, main]

# Cancel in-progress runs on the same branch when a new push comes in
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eslint:
    name: ESLint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Run ESLint
        # max-warnings 100 — initial baseline. Tighten to 50 → 20 → 0 over time.
        run: npm run lint -- --max-warnings 100

      - name: Report results
        if: always()
        run: |
          echo "::notice title=ESLint::Linting complete. See logs above for any errors."

  prettier:
    name: Prettier
    runs-on: ubuntu-latest
    timeout-minutes: 3
    # Optional: format check. Set continue-on-error: true initially to gather baseline.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"
      - run: npm ci --prefer-offline --no-audit
      - name: Prettier check
        run: npx prettier --check "src/**/*.{js,jsx,css}" "server/**/*.js" || echo "::warning::Prettier formatting suggestions available (non-blocking)"
