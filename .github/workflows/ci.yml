name: CI

on:
  pull_request:
    branches: [master, main]
  push:
    branches: [master, main, 'feat/**', 'fix/**']

# Allow concurrent runs on different refs but cancel older runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Lint baseline check
        run: bash scripts/lint-check.sh

      - name: Vite production build (smoke)
        run: npm run build

      # Vitest is informational for now — many tests reference future routes.
      # Mark as continue-on-error until the suite is greener; remove this once
      # the failing tests are either fixed or removed.
      - name: Vitest
        run: npm run test
        continue-on-error: true
