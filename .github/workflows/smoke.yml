name: Smoke Test

on:
  pull_request:
    branches: [master, main, "ux-iteration-*", "prod-mirror-*"]
  push:
    branches: [master, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-boot:
    name: Build + Server Boot Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      # Lightweight MariaDB matching prod's HOSxP version
      mariadb:
        image: mariadb:10.6
        env:
          MYSQL_ROOT_PASSWORD: testroot
          MYSQL_DATABASE: bchhosxpxe_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mariadb-admin ping --silent"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      NODE_ENV: test
      PORT: 4001
      JWT_SECRET: ci-test-secret-not-for-prod-use-only-32chars-min
      JWT_REFRESH_SECRET: ci-test-refresh-secret-not-for-prod-32chars
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASS: testroot
      MYSQL_DB: bchhosxpxe_test
      ANTHROPIC_API_KEY: ""
      DEFAULT_ADMIN_PASSWORD: ci-test-admin-pw
      DISABLE_HTTPS: "true"
      LOG_LEVEL: warn

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Wait for MariaDB
        run: |
          for i in $(seq 1 30); do
            if mysqladmin ping -h 127.0.0.1 -uroot -ptestroot --silent 2>/dev/null; then
              echo "✅ MariaDB ready"
              break
            fi
            sleep 1
          done

      - name: Verify ESM syntax (all server/*.js)
        run: |
          FAIL=0
          for f in $(find server -name "*.js" -not -path "*/node_modules/*"); do
            if ! node --check "$f" 2>/dev/null; then
              echo "❌ Syntax error: $f"
              FAIL=$((FAIL+1))
            fi
          done
          if [ $FAIL -gt 0 ]; then
            echo "::error::$FAIL server files failed syntax check"
            exit 1
          fi
          echo "::notice::All server files pass syntax check"

      - name: Boot smoke test
        run: |
          bash scripts/smoke-test.sh
        timeout-minutes: 3

      - name: Server logs (if failed)
        if: failure()
        run: |
          if [ -f /tmp/bch-smoke-server.log ]; then
            echo "=== Last 100 lines of server log ==="
            tail -100 /tmp/bch-smoke-server.log
          fi
