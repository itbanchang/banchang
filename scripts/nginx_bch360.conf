# ============================================================
# BCH 360° Intelligence V.10 — Nginx Reverse Proxy
# Save as: /etc/nginx/sites-available/bch360
# Enable:  sudo ln -s /etc/nginx/sites-available/bch360 /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx
# ============================================================

# ── Upstream: BCH360 Node.js cluster (PM2 runs on 4001) ──
upstream bch360_backend {
    server 127.0.0.1:4001;
    keepalive 64;
}

# ── Rate limit zones (applied selectively) ──
limit_req_zone $binary_remote_addr zone=bch_api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=bch_login:10m rate=3r/s;

# ── HTTP → HTTPS redirect ──
server {
    listen 80;
    listen [::]:80;
    server_name bch360.example.com 10.109.0.33;
    return 301 https://$host$request_uri;
}

# ── HTTPS main site ──
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name bch360.example.com 10.109.0.33;

    # SSL (replace with Let's Encrypt paths or self-signed)
    ssl_certificate     /etc/ssl/certs/bch360.crt;
    ssl_certificate_key /etc/ssl/private/bch360.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305';
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Security headers (complement app's CSP)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Body size for file uploads
    client_max_body_size 20m;
    client_body_timeout 60s;

    # Gzip (app already has express compression, but belt-and-suspenders)
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1024;

    # ── Access logging (user-level audit) ──
    access_log /var/log/nginx/bch360_access.log combined buffer=32k flush=5s;
    error_log  /var/log/nginx/bch360_error.log warn;

    # ── Login — stricter rate limit (defense against brute force) ──
    location /api/auth/login {
        limit_req zone=bch_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass https://bch360_backend;
        proxy_ssl_verify off;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # ── API — normal rate limit ──
    location /api/ {
        limit_req zone=bch_api burst=50 nodelay;
        limit_req_status 429;
        proxy_pass https://bch360_backend;
        proxy_ssl_verify off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # ── WebSocket (Socket.IO for real-time alerts) ──
    location /socket.io/ {
        proxy_pass https://bch360_backend;
        proxy_ssl_verify off;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400;
    }

    # ── Everything else (SPA) ──
    location / {
        proxy_pass https://bch360_backend;
        proxy_ssl_verify off;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
